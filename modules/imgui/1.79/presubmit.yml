matrix:
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    - windows
  bazel:
    - rolling
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@imgui//:imgui"
bcr_test_module:
  module_path: test
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
      - windows
    bazel:
      - rolling
      - 9.x
      - 8.x
  tasks:
    run_test_module:
      name: Run upstream example_null configurations
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
