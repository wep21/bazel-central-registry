matrix:
  platform:
  - debian11
  - ubuntu2204
  - ubuntu2404
  - macos
  - macos_arm64
  - windows
  bazel:
  - rolling
  - 9.x
  - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@sleef//:sleef'
bcr_test_module:
  module_path: src/libm-tester
  matrix:
    # No windows: upstream does not test libsleef on Windows. Its tester
    # starts the programs under test with fork() and execvp(),
    # src/CMakeLists.txt skips src/libm-tester for MinGW, upstream's only
    # Windows CI, and docs/README.md says that only DFT can be tested there.
    platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
    bazel:
    - rolling
    - 9.x
    - 8.x
  tasks:
    run_test_module:
      name: Run upstream tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
      - '//...'
