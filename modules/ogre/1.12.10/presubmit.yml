matrix:
  platform:
    - debian11
    - ubuntu2204
    - ubuntu2404
    - macos
    - macos_arm64
  bazel:
    - rolling
    - 9.x
    - 8.x
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@ogre//..."
bcr_test_module:
  module_path: Tests
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - ubuntu2404
      - macos
      - macos_arm64
    bazel:
      - rolling
      - 9.x
      - 8.x
  tasks:
    run_test_module:
      name: Run upstream unit tests
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
